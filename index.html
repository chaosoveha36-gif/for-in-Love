<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Srey Keav ❤️</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background">

        <div class="blob blob1"></div>

        <div class="blob blob2"></div>

        <div class="blob blob3"></div>

    </div>



    <!-- =====================================
         QUESTION CARD
    ====================================== -->

    <div
        class="card question-card"
        id="questionCard"
    >

        <!-- Video -->

        <div class="video-box">

            <video
                src="202602011711 (3).mp4"
                autoplay
                muted
                loop
                playsinline
            ></video>

        </div>


        <!-- Heart -->

        <div class="heart">
            ❤️
        </div>


        <p class="small-title">
            A little question for you
        </p>


        <h1>
            Do you love me?
        </h1>


        <h2>
            Van Srey Keav
        </h2>


        <p class="message">
            Please answer honestly... 🥺
        </p>



        <!-- Buttons -->

        <div class="buttons">

            <button
                id="yesBtn"
                class="yes-btn"
                type="button"
            >
                Yes ❤️
            </button>


            <button
                id="noBtn"
                class="no-btn"
                type="button"
            >
                No 😢
            </button>

        </div>

    </div>



    <!-- =====================================
         LOADING
    ====================================== -->

    <div
        class="loader"
        id="loader"
    >

        <div class="loader-heart">
            ❤️
        </div>

        <p>
            Loading love... 💕
        </p>

    </div>



    <!-- =====================================
         RESULT CARD
    ====================================== -->

    <div
        class="card result-card"
        id="resultCard"
    >

        <!-- Love Video -->

        <div class="video-box result-video-box">

            <video
                id="loveVideo"
                src="Love.mp4"
                loop
                playsinline
            ></video>

        </div>


        <!-- Heart -->

        <div class="heart">
            ❤️
        </div>


        <p class="small-title">
            I knew it...
        </p>


        <h1>
            You said YES! 🫢
        </h1>


        <p class="message">

            You just made this moment
            <br>

            extra special. ❤️

        </p>


        <div class="badge">

            Forever & Always 💕

        </div>


        <!-- Back Button -->

        <button
            id="backBtn"
            class="back-btn"
            type="button"
        >

            ↩ Back

        </button>

    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
