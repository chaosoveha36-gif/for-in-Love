```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Do You Love Me? ❤️</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==============================
       BACKGROUND HEARTS
  =============================== -->

  <div class="background-hearts">
    <span>❤️</span>
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💓</span>
    <span>💞</span>
    <span>❤️</span>
    <span>💗</span>
  </div>


  <!-- ==============================
       QUESTION PAGE
  =============================== -->

  <main class="question-container">

    <div class="love-card">

      <!-- Video -->
      <div class="video-wrapper">

        <video
          class="local-gif"
          src="202602011711 (3).mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>

      </div>


      <!-- Heart -->
      <div class="main-heart">
        ❤️
      </div>


      <!-- Small title -->
      <p class="question-label">
        I have a little question for you...
      </p>


      <!-- Main question -->
      <h1 class="question">
        Do you love me?

        <span>
          Van Srey Keav 💕
        </span>
      </h1>


      <!-- Description -->
      <p class="question-description">
        Please answer honestly... 🥺
      </p>


      <!-- Buttons -->
      <div class="button-container">

        <button
          class="yes-btn btn js-yes-btn"
          type="button"
        >
          ❤️ Yes
        </button>

        <button
          class="no-btn btn js-no-btn"
          type="button"
        >
          No 😢
        </button>

      </div>


      <p class="bottom-text">
        Choose carefully... 😏
      </p>

    </div>

  </main>


  <!-- ==============================
       HEART LOADER
  =============================== -->

  <div class="cssload-main">

    <div class="cssload-heart">

      <span class="cssload-heartL"></span>

      <span class="cssload-heartR"></span>

      <span class="cssload-square"></span>

    </div>

    <div class="cssload-shadow"></div>

    <p class="loading-text">
      Loading love...
    </p>

  </div>


  <!-- ==============================
       RESULT PAGE
  =============================== -->

  <section class="result-container">

    <div class="result-card">

      <!-- Result video -->
      <div class="result-video-wrapper">

        <video
          class="gif-result"
          src="Love.mp4"
          loop
          muted
          playsinline
        ></video>

      </div>


      <!-- Heart -->
      <div class="result-heart">
        💖
      </div>


      <!-- Result -->
      <h2>
        I knew you would say YES! 🫢
      </h2>


      <p class="result-message">
        You just made my heart very happy ❤️
      </p>


      <div class="forever">
        Forever & Always 💕
      </div>

    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
```
