<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Srey Keav ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>


    <!-- QUESTION -->
    <div class="card question-card" id="questionCard">

        <div class="video-box">
            <video
                src="202602011711 (3).mp4"
                autoplay
                muted
                loop
                playsinline
            ></video>
        </div>

        <div class="heart">❤️</div>

        <p class="small-title">
            A little question for you
        </p>

        <h1>
            Do you love me?
        </h1>

        <h2>
            Van Srey Keav
        </h2>

        <p class="message">
            Please answer honestly... 🥺
        </p>

        <div class="buttons">

            <button
                id="yesBtn"
                class="yes-btn"
            >
                Yes ❤️
            </button>

            <button
                id="noBtn"
                class="no-btn"
            >
                No 😢
            </button>

        </div>

    </div>


    <!-- LOADING -->
    <div
        id="loader"
        class="loader"
    >

        <div class="loader-heart">
            ❤️
        </div>

        <p>
            Wait a moment... 💕
        </p>

    </div>


    <!-- RESULT -->
    <div
        class="card result-card"
        id="resultCard"
    >

        <div class="video-box result-video-box">

            <video
                id="loveVideo"
                src="Love.mp4"
                loop
                playsinline
            ></video>

        </div>

        <div class="heart">
            ❤️
        </div>

        <p class="small-title">
            I knew it...
        </p>

        <h1>
            You said YES! 🫢
        </h1>

        <p class="message">
            You just made this moment
            <br>
            extra special. ❤️
        </p>

        <div class="badge">
            Forever & Always 💕
        </div>

        <button
            id="backBtn"
            class="back-btn"
        >
            ↩ Back
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
